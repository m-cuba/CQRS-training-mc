services:
  # =========================
  # WRITE DB (EVENT STORE)
  # =========================
  inventory-postgres:
    image: postgres:16
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5432:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventorydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # AUDIT DB
  # =========================
  audit-postgres:
    image: postgres:16
    container_name: audit-postgres
    environment:
      POSTGRES_DB: auditdb
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    ports:
      - "5433:5432"
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d auditdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # PULSAR
  # =========================
  pulsar:
    image: apachepulsar/pulsar:4.0.2
    container_name: inventory-pulsar
    command: ["bin/pulsar", "standalone"]
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # WRITE API
  # =========================
  inventory-api:
    image: inventory.api
    build:
      context: .
      dockerfile: Sportsbook.InventoryService.API/Dockerfile
    container_name: inventory-api
    depends_on:
      inventory-postgres:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Pulsar__ServiceUrl: pulsar://pulsar:6650
      ConnectionStrings__InventoryDb: "Host=inventory-postgres;Port=5432;Database=inventorydb;Username=inventory_user;Password=inventory_pass"
      ConnectionStrings__InventoryReadDb: "Host=inventory-postgres;Port=5432;Database=inventorydb;Username=inventory_user;Password=inventory_pass"
    ports:
      - "5000:8080"

  # =========================
  # AUDIT MICROSERVICE
  # =========================
  inventory-audit:
    image: inventory.audit
    build:
      context: .
      dockerfile: Sportsbook.InventoryService.Audit.API/Dockerfile
    container_name: inventory-audit
    depends_on:
      audit-postgres:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Pulsar__ServiceUrl: pulsar://pulsar:6650
      ConnectionStrings__AuditDb: "Host=audit-postgres;Port=5432;Database=auditdb;Username=audit_user;Password=audit_pass"
    ports:
      - "5003:8080"

volumes:
  inventory_postgres_data:
  audit_postgres_data: